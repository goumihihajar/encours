
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMSD — Site en cours de construction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGO AMSD GRAND, SANS FOND -->
<div class="logo-header">
  <img src="logo_amsd.png" alt="AMSD — Agence Marocaine du Sang et de ses Dérivés">
</div>

<main class="page">

  <!-- =================== LEFT : CONSTRUCTION =================== -->
  <section class="content-side">



    <h1 class="construction-title">
      Site en cours<br>
      de <span class="highlight"> construction</span>
    </h1>

    <div class="progress-section">
      <div class="progress-label">
        <span>Avancement</span>
        <span class="progress-percent">20%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
    </div>

    <div class="pulse-live">
      <span class="pulse-dot"></span>
      <span>Développement actif</span>
    </div>

  </section>

  <!-- =================== RIGHT : CARTE =================== -->
  <section class="map-side">
    <div class="map-wrapper">
      <img src="carte.png" alt="Carte du Maroc avec les centres de collecte de sang" class="map-image">
      <div class="message-overlay">
        <p class="message-text">
          <strong>Mobilisons-nous</strong> pour sauver des vies
        </p>
      </div>
    </div>
  </section>

</main>

</body>
</html>
